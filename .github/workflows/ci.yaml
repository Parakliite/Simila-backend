name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Run unit tests
        run: go test ./...

      - name: Run security check
        run: go tool gosec -exclude-dir=internal/database ./...
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Run formatting check
        run: test -z $(go fmt ./...)

      - name: Run Lint check
        run: go tool staticcheck ./...
 
