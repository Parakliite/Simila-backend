openapi: 3.1.0
info:
  title: Simila API
  version: 1.0.0
  description: API contract for Simila client-facing endpoints.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Media
  - name: Search
  - name: Discovery
  - name: Ratings
  - name: Matches
  - name: Recommendations
  - name: Reactions
  - name: Impact
  - name: Watchlist
  - name: Home

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Check API health
      security: []
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "202":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/login:
    post:
      tags: [Auth]
      summary: Create access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Tokens created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token and create new tokens
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/users/activated:
    put:
      tags: [Users]
      summary: Activate a user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateUserRequest"
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/users/profile:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/media/{id}:
    get:
      tags: [Media]
      summary: Get media by TMDB ID and media type
      parameters:
        - $ref: "#/components/parameters/TMDBID"
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
      responses:
        "200":
          description: Media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/search:
    get:
      tags: [Search]
      summary: Search users and TMDB media
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/SearchLimit"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/discovery/rating-candidates:
    get:
      tags: [Discovery]
      summary: List random media candidates for rating
      responses:
        "200":
          description: Rating candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/ratings:
    put:
      tags: [Ratings]
      summary: Create or update a rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRatingRequest"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Ratings]
      summary: List ratings for the authenticated user
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: User ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRatingsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/ratings/tmdb/{tmdb_id}:
    get:
      tags: [Ratings]
      summary: Get the authenticated user's rating for one media item
      parameters:
        - $ref: "#/components/parameters/TMDBID"
        - $ref: "#/components/parameters/MediaTypeQuery"
      responses:
        "200":
          description: User rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRatingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Ratings]
      summary: Delete the authenticated user's rating for one media item
      parameters:
        - $ref: "#/components/parameters/TMDBID"
        - $ref: "#/components/parameters/MediaTypeQuery"
      responses:
        "204":
          description: Rating deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/media/tmdb/{tmdb_id}/ratings:
    get:
      tags: [Ratings]
      summary: List ratings for a media item
      parameters:
        - $ref: "#/components/parameters/TMDBID"
        - $ref: "#/components/parameters/MediaTypeQuery"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Ratings for media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRatingsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/matches:
    get:
      tags: [Matches]
      summary: List matches for the authenticated user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/home/top-rated-by-matches:
    get:
      tags: [Home]
      summary: Top rated media from your matches
      description: |
        Returns media rated highly by your matches within the past 14 days.
        Results are deduplicated by media and ordered by rating value,
        then match score, then recency.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Top rated by matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopRatedByMatchesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/home/trending:
    get:
      tags: [Home]
      summary: Trending movies and TV shows this week
      description: |
        Returns the current trending movies and TV shows from TMDB.
        Does not persist data; purely ephemeral.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Trending media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/recommendations/{user_id}:
    get:
      tags: [Recommendations]
      summary: Get recommendations from a matched user
      parameters:
        - $ref: "#/components/parameters/UserID"
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 10
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/reactions:
    put:
      tags: [Reactions]
      summary: Create or update a reaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertReactionRequest"
      responses:
        "200":
          description: Reaction saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/reactions/{rating_user_id}/tmdb/{tmdb_id}:
    delete:
      tags: [Reactions]
      summary: Delete a reaction
      parameters:
        - name: rating_user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TMDBID"
        - $ref: "#/components/parameters/MediaTypeQuery"
      responses:
        "204":
          description: Reaction deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/users/{user_id}/reactions:
    get:
      tags: [Reactions]
      summary: List reactions for a target user's ratings
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Reactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/ratings/{rating_user_id}/tmdb/{tmdb_id}/reactions/count:
    get:
      tags: [Reactions]
      summary: Get reaction count for a rating
      parameters:
        - name: rating_user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TMDBID"
        - $ref: "#/components/parameters/MediaTypeQuery"
      responses:
        "200":
          description: Reaction count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionCountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/impact/{user_id}:
    get:
      tags: [Impact]
      summary: List grouped reaction impact for the authenticated user
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Impact reactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/watchlist:
    post:
      tags: [Watchlist]
      summary: Add media to the authenticated user's watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertWatchlistRequest"
      responses:
        "200":
          description: Watchlist item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Watchlist]
      summary: List the authenticated user's watchlist
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WatchlistStatus"
      responses:
        "200":
          description: Watchlist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/watchlist/tmdb/{tmdb_id}:
    patch:
      tags: [Watchlist]
      summary: Update a watchlist item's status
      parameters:
        - $ref: "#/components/parameters/TMDBID"
        - $ref: "#/components/parameters/MediaTypeQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWatchlistStatusRequest"
      responses:
        "200":
          description: Watchlist item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Watchlist]
      summary: Delete a watchlist item
      parameters:
        - $ref: "#/components/parameters/TMDBID"
        - $ref: "#/components/parameters/MediaTypeQuery"
      responses:
        "204":
          description: Watchlist item deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    TMDBID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaID:
      name: media_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque pagination cursor returned by the previous response.
    ListLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 70
    SearchLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 70
    MediaTypeQuery:
      name: type
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/MediaType"
      description: Media type filter - 'movie' or 'tv'.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Request is authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Edit conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Date:
      type: string
      format: date-time
    CursorValue:
      type:
        - string
        - "null"

    HealthResponse:
      type: object
      required: [status, environment, version]
      properties:
        status:
          type: string
          example: available
        environment:
          type: string
          example: development
        version:
          type: string
          example: 1.0.0

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties:
            type: string

    RegisterUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 500
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    ActivateUserRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 26
          maxLength: 26
    UpdateUserProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 500
        about:
          type: string
        profile_picture_url:
          type: string

    User:
      type: object
      required: [id, created_at, updated_at, name, email, activated]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        name:
          type: string
        profile_picture_url:
          type: string
        about:
          type: string
        email:
          type: string
          format: email
        activated:
          type: boolean
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    Token:
      type: object
      required: [token, session_id]
      properties:
        token:
          type: string
        session_id:
          type:
            - string
            - "null"
          format: uuid
    AuthResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          $ref: "#/components/schemas/Token"
        refresh_token:
